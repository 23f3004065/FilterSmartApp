<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#041722">
<title>Filter station</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;600&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:#020b12;color:#eaf8ff;overflow:hidden;font:300 1rem/1.35 Sora,system-ui,-apple-system,"Segoe UI",sans-serif}
#sea{position:fixed;inset:0;width:100%;height:100%;display:block}
main{position:relative;z-index:1;height:100dvh;max-width:1100px;margin:0 auto;display:flex;flex-direction:column;padding:calc(18px + env(safe-area-inset-top,0px)) 22px calc(22px + env(safe-area-inset-bottom,0px))}
header{display:flex;justify-content:space-between;align-items:flex-start}
#title{margin:0;padding:8px 24px 8px 0;font-weight:600;font-size:1.05rem}
#sys{margin:0;opacity:.75;font-size:.92rem;min-height:1.4em}
.live{display:flex;align-items:center;gap:8px;padding-top:10px;font-size:.88rem;opacity:.85}
.live i{width:8px;height:8px;border-radius:50%;background:#6ff5c4;animation:pulse 2.4s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(111,245,196,.6)}70%,100%{box-shadow:0 0 0 10px rgba(111,245,196,0)}}
#water{flex:1;display:flex;align-items:flex-end;min-height:140px;padding:20px 0 26px}
#verdict{margin:0;font-weight:300;font-size:clamp(3rem,15vw,8.5rem);line-height:.95;letter-spacing:-.03em;text-shadow:0 2px 40px rgba(0,20,30,.4)}
.read{display:flex;gap:10px 34px;flex-wrap:wrap;padding-bottom:18px}
.read span{display:block;opacity:.7;font-size:.92rem}
.read b{display:block;font-weight:300;font-size:clamp(1.8rem,7.5vw,3rem);letter-spacing:-.02em;line-height:1.15;font-variant-numeric:tabular-nums}
#flowBox{padding:6px 0}
#warn{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 14px;background:#ffc94a;color:#2b1d00;border-radius:24px;padding:12px 22px;margin-bottom:12px;font-weight:600;animation:rise .6s ease-out}
#warn b{font-weight:600;font-size:1.15rem}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
#call{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:4px 14px;background:#eefaff;color:#06283a;border-radius:999px;padding:16px 26px;text-decoration:none;font-weight:600}
#call span{font-weight:300;font-variant-numeric:tabular-nums}
:focus-visible{outline:3px solid #ffc94a;outline-offset:3px}
.hold{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
@media (prefers-reduced-motion:reduce){.live i,#warn{animation:none}}
</style>
</head>
<body>
<canvas id="sea" aria-hidden="true"></canvas>
<main>
  <header>
    <div><h1 id="title">Filter station</h1><p id="sys">Connecting…</p></div>
    <span class="live"><i></i>Live</span>
  </header>
  <section id="water" role="status" aria-label="Turbidity"><p id="verdict"></p></section>
  <section class="read">
    <div id="flowBox"><span>Flow rate</span><b id="flow">—</b></div>
    <div><span>Running time</span><b id="time">00:00:00</b></div>
  </section>
  <div id="warn" role="alert" hidden><b>Change the filter</b><span id="warnSub"></span></div>
  <a id="call" href="tel:+919810203440"><b>Call service</b><span>+91 98102 03440</span></a>
</main>

<script>
(function(){
"use strict";
var TOPIC="fs-showcase-7k3x9qmv2zt4", RELAY="https://ntfy.sh", START=30;
var $=function(i){return document.getElementById(i)};
var clamp=function(v,a,b){return Math.min(b==null?1:b,Math.max(a==null?0:a,v))};
var lerp=function(a,b,t){return a+(b-a)*t}, ease=function(t){return t*t*(3-2*t)};
var reduced=matchMedia("(prefers-reduced-motion: reduce)").matches;
var isLaptop=matchMedia("(hover:hover) and (pointer:fine)").matches;

/* ---------- shared state, rebuilt from a small event log ---------- */
var S=null, seen={}, bc=null;
function fresh(t,seed){return {t0:t,seed:seed,turb:{v:"clean",t0:t,from:0},wear:{v:"ok",t0:t,from:92},hide:{v:false,t0:t}}}
function lvl(t){var a=S.turb,g=a.v==="unclean"?1:0;return lerp(a.from,g,ease(clamp((t-a.t0)/3000)))}   // 0 clear .. 1 murky
function eff(t){var a=S.wear,g=a.v==="low"?74:92;return lerp(a.from,g,ease(clamp((t-a.t0)/4000)))}     // filter efficiency %
function flowAt(s){return .18+.0125*Math.sin(s*.37+S.seed*6.283)+.0075*Math.sin(s*.91+S.seed*17.1)}   // always inside 0.16 to 0.20
function reduce(ev){
  var t=ev.t;
  if(ev.k==="reset"){if(S&&t<S.t0)return;S=fresh(t,+ev.seed||0);return}
  if(!S||t<S.t0)return;
  if(ev.k==="turb"&&t>=S.turb.t0)S.turb={v:ev.v==="unclean"?"unclean":"clean",t0:t,from:lvl(t)};
  else if(ev.k==="wear"&&t>=S.wear.t0)S.wear={v:ev.v==="low"?"low":"ok",t0:t,from:eff(t)};
  else if(ev.k==="hide"&&t>=S.hide.t0)S.hide={v:!!ev.v,t0:t};
}
function deliver(ev){
  if(!ev||typeof ev.e!=="string"||typeof ev.t!=="number"||!isFinite(ev.t)||seen[ev.e])return;
  seen[ev.e]=1;reduce(ev);
}
function act(ev){
  ev.t=Date.now();ev.e=Math.random().toString(36).slice(2,10);deliver(ev);
  try{fetch(RELAY+"/"+TOPIC,{method:"POST",body:JSON.stringify(ev)}).catch(function(){})}catch(e){}
  if(bc)bc.postMessage(ev);
}
try{bc=new BroadcastChannel("fs-showcase");bc.onmessage=function(m){deliver(m.data)}}catch(e){}
function connect(){
  var es;try{es=new EventSource(RELAY+"/"+TOPIC+"/sse?since=all")}catch(e){return}
  es.onmessage=function(m){try{var j=JSON.parse(m.data);if(j.event==="message")deliver(JSON.parse(j.message))}catch(e){}};
}

/* ---------- hidden controls: keys on a laptop, 1-second holds on a phone ---------- */
var A={
  turb:function(){S&&act({k:"turb",v:S.turb.v==="clean"?"unclean":"clean"})},
  wear:function(){S&&act({k:"wear",v:S.wear.v==="ok"?"low":"ok"})},
  hide:function(){S&&act({k:"hide",v:!S.hide.v})},
  reset:function(){act({k:"reset",seed:Math.random()})}
};
addEventListener("keydown",function(e){
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  var k=e.key.toLowerCase();
  if(k==="t")A.turb();else if(k==="f")A.wear();else if(k==="h")A.hide();else if(k==="r"&&e.shiftKey)A.reset();
});
function hold(el,fn){
  var t;el.classList.add("hold");
  el.addEventListener("pointerdown",function(){clearTimeout(t);t=setTimeout(function(){fn();if(navigator.vibrate)navigator.vibrate(30)},1000)});
  ["pointerup","pointerleave","pointercancel"].forEach(function(n){el.addEventListener(n,function(){clearTimeout(t)})});
  el.addEventListener("contextmenu",function(e){e.preventDefault()});
}
hold($("water"),A.turb);hold($("flowBox"),A.wear);hold($("title"),A.hide);

/* ---------- the water ---------- */
var cv=$("sea"),g=cv.getContext("2d"),W=0,H=0,dpr=1,phase=0;
function size(){dpr=Math.min(devicePixelRatio||1,2);W=cv.width=Math.round(innerWidth*dpr);H=cv.height=Math.round(innerHeight*dpr)}
addEventListener("resize",size);size();
var motes=[];for(var i=0;i<70;i++)motes.push({x:Math.random(),y:Math.random(),r:.6+Math.random()*2.2,s:.2+Math.random()*.8,p:Math.random()*6.28});
var CT=[10,98,130],CB=[3,30,54],MT=[118,94,50],MB=[36,26,12];
function mix(a,b,t){return [0,1,2].map(function(i){return Math.round(lerp(a[i],b[i],t))})}
function rgb(c){return "rgb("+c.join(",")+")"}
function paint(level,fill,dt){
  var bg=g.createLinearGradient(0,0,0,H);bg.addColorStop(0,"#06202c");bg.addColorStop(1,"#020b12");g.fillStyle=bg;g.fillRect(0,0,W,H);
  var wt=lerp(H*.92,-H*.06,fill),A1=H*.012,top=mix(CT,MT,level),bot=mix(CB,MB,level),tint=mix([190,240,255],[235,205,140],level);
  var P=new Path2D();P.moveTo(0,H);
  for(var x=0;x<=W;x+=10)P.lineTo(x,wt+A1*Math.sin(x/W*7+phase*2)+A1*.6*Math.sin(x/W*13-phase*3));
  P.lineTo(W,H);P.closePath();
  var gr=g.createLinearGradient(0,Math.max(0,wt),0,H);gr.addColorStop(0,rgb(top));gr.addColorStop(1,rgb(bot));
  g.fillStyle=gr;g.fill(P);
  g.save();g.clip(P);
  for(var i=0;i<4;i++){
    var base=lerp(.15,.85,i/3)*H,amp=H*(.02+i*.008);
    g.beginPath();g.moveTo(0,H);
    for(x=0;x<=W;x+=12)g.lineTo(x,base+amp*Math.sin(x/W*(3+i*1.3)+phase*(1+i*.4)+i*2));
    g.lineTo(W,H);g.closePath();g.fillStyle="rgba("+tint.join(",")+","+(.05+.012*i)+")";g.fill();
  }
  g.globalCompositeOperation="lighter";
  var ca=(1-level*.75)*.07;
  for(i=0;i<6;i++){
    var cx=(.5+.5*Math.sin(phase*.5+i*1.7))*W,cy=(.5+.5*Math.sin(phase*.35+i*2.3))*H,r=H*(.18+.04*i);
    var rg=g.createRadialGradient(cx,cy,0,cx,cy,r);rg.addColorStop(0,"rgba(200,245,255,"+ca+")");rg.addColorStop(1,"rgba(200,245,255,0)");
    g.fillStyle=rg;g.fillRect(cx-r,cy-r,2*r,2*r);
  }
  g.globalCompositeOperation="source-over";
  var n=Math.round(25+45*level),ma=.12+.5*level;
  for(i=0;i<n;i++){
    var m=motes[i];if(!reduced){m.y-=m.s*dt*.02;if(m.y<0){m.y=1;m.x=Math.random()}}
    g.fillStyle="rgba("+tint.join(",")+","+ma*(.4+.6*m.s)+")";
    g.beginPath();g.arc((m.x+.02*Math.sin(phase*.7+m.p))*W,m.y*H,m.r*dpr*(1+level),0,6.283);g.fill();
  }
  g.restore();
  if(fill<1){g.strokeStyle="rgba(210,248,255,.5)";g.lineWidth=2*dpr;g.stroke(P)}
}

/* ---------- text on top ---------- */
function fmt(s){s=Math.floor(s);return [Math.floor(s/3600),Math.floor(s%3600/60),s%60].map(function(n){return String(n).padStart(2,"0")}).join(":")}
function dom(n){
  var el=S?Math.max(0,(n-S.t0)/1000):0,up=!!S&&el>=START;
  $("time").textContent=fmt(el);
  $("sys").textContent=!S?"Connecting…":up?"":"Starting systems, "+Math.ceil(START-el)+" s";
  var fl="—";
  if(up){var lo=9,hi=0;for(var i=0;i<=10;i++){var v=flowAt(el-i*.5);lo=Math.min(lo,v);hi=Math.max(hi,v)}
    var a=lo.toFixed(2),b=hi.toFixed(2);fl=(a===b?a:a+"–"+b)+" L/min"}
  $("flow").textContent=fl;
  $("verdict").textContent=up&&!S.hide.v?(lvl(n)>=.5?"Needs cleaning":"Clean"):"";
  var w=up&&eff(n)<80;$("warn").hidden=!w;
  if(w)$("warnSub").textContent="Efficiency "+Math.round(eff(n))+"%, limit 80%";
}
var last=0,domT=0;
function frame(ts){
  var dt=Math.min(50,ts-last||16);last=ts;
  var n=Date.now(),level=0,fill=0,fv=.18;
  if(S){var el=(n-S.t0)/1000;level=lvl(n);fill=clamp(el/START);fv=flowAt(Math.max(0,el))}
  if(!reduced)phase+=dt/1000*(.3+clamp((fv-.16)/.04)*.5);   // faster flow, faster water
  paint(level,fill,dt);
  if(ts-domT>250){domT=ts;dom(n)}
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* ---------- start ---------- */
connect();
if(isLaptop)A.reset();                                  // a laptop load restarts everything
else setTimeout(function(){if(!S)A.reset()},3500);      // a phone joins the running session
})();
</script>
</body>
</html>
