<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#041722">
<title>Filter station</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;600&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:#020b12;color:#eaf8ff;overflow:hidden;font:300 1rem/1.35 Sora,system-ui,-apple-system,"Segoe UI",sans-serif}
#sea{position:fixed;inset:0;width:100%;height:100%;display:block}
main{position:relative;z-index:1;height:100dvh;max-width:1100px;margin:0 auto;display:flex;flex-direction:column;overflow-y:auto;padding:calc(16px + env(safe-area-inset-top,0px)) 22px calc(20px + env(safe-area-inset-bottom,0px));text-shadow:0 1px 14px rgba(0,20,30,.45)}
header{display:flex;justify-content:space-between;align-items:flex-start}
#title{margin:0;padding:8px 24px 8px 0;font-weight:600;font-size:1.05rem}
#sys{margin:0;opacity:.8;font-size:.92rem;min-height:1.4em}
.live{display:flex;align-items:center;gap:8px;padding:12px 0 10px 18px;font-size:.88rem;opacity:.85}
.live i{width:8px;height:8px;border-radius:50%;background:#6ff5c4;animation:pulse 2.4s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(111,245,196,.6)}70%,100%{box-shadow:0 0 0 10px rgba(111,245,196,0)}}
/* filter-change warning: its own strip at the top */
#warn{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 14px;background:#ffc94a;color:#2b1d00;border-radius:16px;padding:12px 20px;margin:4px 0 0;font-weight:600;text-shadow:none;animation:rise .6s ease-out}
#warn b{font-weight:600;font-size:1.1rem}
@keyframes rise{from{opacity:0;transform:translateY(-10px)}}
#water{flex:1;display:flex;align-items:flex-end;min-height:120px;padding:18px 0 22px}
#verdict{margin:0;font-weight:300;font-size:clamp(3rem,15vw,8.5rem);line-height:.95;letter-spacing:-.03em;text-shadow:0 2px 40px rgba(0,20,30,.4)}
/* maintenance life tracker */
.maint{display:grid;gap:4px 34px;padding-bottom:12px}
@media (min-width:760px){.maint{grid-template-columns:1fr 1fr}}
.lh{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:.95rem}
.lh b{font-weight:600;font-variant-numeric:tabular-nums}
.meter{position:relative;height:6px;border-radius:3px;background:rgba(234,248,255,.22);margin-top:8px}
.meter i{display:block;height:100%;width:0;border-radius:3px;background:#8fe3f5}
.meter u{position:absolute;left:80%;top:-4px;bottom:-4px;width:2px;background:rgba(234,248,255,.65)}
.life.due .meter i{background:#ffc94a}
.life{padding:8px 0}
.rem{display:inline-block;margin-top:8px;background:#ffc94a;color:#2b1d00;border-radius:999px;padding:5px 14px;font-weight:600;font-size:.9rem;text-decoration:none;text-shadow:none}
#call{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:4px 14px;background:#eefaff;color:#06283a;border-radius:999px;padding:16px 26px;text-decoration:none;font-weight:600;text-shadow:none}
#call span{font-weight:300;font-variant-numeric:tabular-nums}
:focus-visible{outline:3px solid #ffc94a;outline-offset:3px}
.hold{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
@media (prefers-reduced-motion:reduce){.live i,#warn{animation:none}}
</style>
</head>
<body>
<canvas id="sea" aria-hidden="true"></canvas>
<main>
  <header>
    <div><h1 id="title">Filter station</h1><p id="sys"></p></div>
    <span class="live" id="live"><i></i>Live</span>
  </header>
  <div id="warn" role="alert" hidden><b>Change filters</b></div>
  <section id="water" role="status" aria-label="Turbidity"><p id="verdict"></p></section>
  <section class="maint" id="maint" aria-label="Maintenance">
    <div class="life" id="life-tank"><div class="lh"><span>Sedimentation tank</span><b><span id="h-tank">0</span> / 200 h</b></div><div class="meter"><i id="bar-tank"></i><u></u></div><a class="rem" id="rem-tank" href="tel:+919810203440" hidden></a></div>
    <div class="life" id="life-mem"><div class="lh"><span>Ultrafiltration membrane</span><b><span id="h-mem">0</span> / 760 h</b></div><div class="meter"><i id="bar-mem"></i><u></u></div><a class="rem" id="rem-mem" href="tel:+919810203440" hidden></a></div>
  </section>
  <a id="call" href="tel:+919810203440"><b>Call service</b><span>+91 98102 03440</span></a>
</main>

<script>
(function(){
"use strict";
var TOPIC="fs-showcase-v2-m4x8q2kz7p5w", RELAY="https://ntfy.sh";
/* Demo time scale: the full life of each part is shown in minutes (6000x faster than real hours). */
var LIFE={tank:{hours:200,demoS:120},mem:{hours:760,demoS:456}}, REMIND_AT=80;
var $=function(i){return document.getElementById(i)};
var clamp=function(v,a,b){return Math.min(b==null?1:b,Math.max(a==null?0:a,v))};
var lerp=function(a,b,t){return a+(b-a)*t}, ease=function(t){return t*t*(3-2*t)};
var reduced=matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ---------- shared state, rebuilt from a small event log ---------- */
function fresh(t){return {t0:t,on:false,onSince:0,runMs:0,pt:t,st:t,base:{tank:0,mem:0},
  turb:{v:"unclean",t0:t,from:1},wear:{v:"ok",t0:t,from:92},hide:{v:false,t0:t}}}
var S=fresh(0), seen={}, bc=null;       // the app starts instantly, switched off, showing the default
function lvl(t){var a=S.turb,g=a.v==="unclean"?1:0;return lerp(a.from,g,ease(clamp((t-a.t0)/3000)))}   // 0 clear .. 1 murky
function eff(t){var a=S.wear,g=a.v==="low"?74:92;return lerp(a.from,g,ease(clamp((t-a.t0)/4000)))}     // filter efficiency %
function used(t){return S.runMs+(S.on?Math.max(0,t-S.onSince):0)}                                      // powered-on time, from timestamps
function life(k,t){var f=Math.max(0,used(t)-S.base[k])/1000/LIFE[k].demoS;return {h:LIFE[k].hours*f,pct:f*100}}
function reduce(ev){
  var t=ev.t;
  if(ev.k==="reset"){if(t<S.t0)return;S=fresh(t);return}
  if(t<S.t0)return;
  if(ev.k==="power"){
    if(t<S.pt)return;S.pt=t;
    if(ev.v&&!S.on){S.on=true;S.onSince=t}
    else if(!ev.v&&S.on){S.runMs+=Math.max(0,t-S.onSince);S.on=false;      // off: back to the defaults, meters keep their hours
      S.turb={v:"unclean",t0:t,from:lvl(t)};S.wear={v:"ok",t0:t,from:eff(t)};S.hide={v:false,t0:t}}
  }else if(ev.k==="svc"){
    if(t<S.st)return;S.st=t;var u=used(t);
    if(ev.v==="tank"||ev.v==="both")S.base.tank=u;
    if(ev.v==="mem"||ev.v==="both")S.base.mem=u;
  }else if(ev.k==="turb"&&t>=S.turb.t0)S.turb={v:ev.v==="unclean"?"unclean":"clean",t0:t,from:lvl(t)};
  else if(ev.k==="wear"&&t>=S.wear.t0)S.wear={v:ev.v==="low"?"low":"ok",t0:t,from:eff(t)};
  else if(ev.k==="hide"&&t>=S.hide.t0)S.hide={v:!!ev.v,t0:t};
}
function deliver(ev){
  if(!ev||typeof ev.e!=="string"||typeof ev.t!=="number"||!isFinite(ev.t)||seen[ev.e])return;
  seen[ev.e]=1;reduce(ev);
}
function act(ev){
  ev.t=Date.now();ev.e=Math.random().toString(36).slice(2,10);deliver(ev);
  try{fetch(RELAY+"/"+TOPIC,{method:"POST",body:JSON.stringify(ev)}).catch(function(){})}catch(e){}
  if(bc)bc.postMessage(ev);
}
try{bc=new BroadcastChannel("fs-showcase-v2");bc.onmessage=function(m){deliver(m.data)}}catch(e){}
(function connect(){
  var es;try{es=new EventSource(RELAY+"/"+TOPIC+"/sse?since=all")}catch(e){return}
  es.onmessage=function(m){try{var j=JSON.parse(m.data);if(j.event==="message")deliver(JSON.parse(j.message))}catch(e){}};
})();

/* ---------- hidden controls: function keys on a laptop, holds on a phone ---------- */
var A={
  power:function(){act({k:"power",v:!S.on})},
  turb:function(){act({k:"turb",v:S.turb.v==="clean"?"unclean":"clean"})},
  wear:function(){act({k:"wear",v:S.wear.v==="ok"?"low":"ok"})},
  hide:function(){act({k:"hide",v:!S.hide.v})},
  reset:function(){act({k:"reset"})},
  svcT:function(){act({k:"svc",v:"tank"})},
  svcM:function(){act({k:"svc",v:"mem"})}
};
addEventListener("keydown",function(e){
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  var a=null;
  if(e.key==="F2")a=e.shiftKey?"reset":"power";
  else if(e.key==="F4")a=e.shiftKey?"svcT":"turb";
  else if(e.key==="F8")a="wear";
  else if(e.key==="F9")a=e.shiftKey?"svcM":"hide";
  if(a){e.preventDefault();A[a]()}
},true);
function hold(el,fn,ms){
  var t;el.classList.add("hold");
  el.addEventListener("pointerdown",function(){clearTimeout(t);t=setTimeout(function(){fn();if(navigator.vibrate)navigator.vibrate(30)},ms||1000)});
  ["pointerup","pointerleave","pointercancel"].forEach(function(n){el.addEventListener(n,function(){clearTimeout(t)})});
  el.addEventListener("contextmenu",function(e){e.preventDefault()});
}
hold($("water"),A.turb);hold($("maint"),A.wear);hold($("title"),A.hide);hold($("live"),A.power,1500);

/* ---------- the water ---------- */
var cv=$("sea"),g=cv.getContext("2d"),W=0,H=0,dpr=1,phase=0;
function size(){dpr=Math.min(devicePixelRatio||1,2);W=cv.width=Math.round(innerWidth*dpr);H=cv.height=Math.round(innerHeight*dpr)}
addEventListener("resize",size);size();
var motes=[];for(var i=0;i<70;i++)motes.push({x:Math.random(),y:Math.random(),r:.6+Math.random()*2.2,s:.2+Math.random()*.8,p:Math.random()*6.28});
var CT=[10,98,130],CB=[3,30,54],MT=[118,94,50],MB=[36,26,12];
function mix(a,b,t){return [0,1,2].map(function(i){return Math.round(lerp(a[i],b[i],t))})}
function rgb(c){return "rgb("+c.join(",")+")"}
function paint(level,dt){
  var A1=H*.012,top=mix(CT,MT,level),bot=mix(CB,MB,level),tint=mix([190,240,255],[235,205,140],level);
  var P=new Path2D();P.moveTo(0,H);
  for(var x=0;x<=W;x+=10)P.lineTo(x,-H*.04+A1*Math.sin(x/W*7+phase*2)+A1*.6*Math.sin(x/W*13-phase*3));
  P.lineTo(W,H);P.closePath();
  g.fillStyle="#020b12";g.fillRect(0,0,W,H);
  var gr=g.createLinearGradient(0,0,0,H);gr.addColorStop(0,rgb(top));gr.addColorStop(1,rgb(bot));
  g.fillStyle=gr;g.fill(P);
  g.save();g.clip(P);
  for(var i=0;i<4;i++){
    var base=lerp(.15,.85,i/3)*H,amp=H*(.02+i*.008);
    g.beginPath();g.moveTo(0,H);
    for(x=0;x<=W;x+=12)g.lineTo(x,base+amp*Math.sin(x/W*(3+i*1.3)+phase*(1+i*.4)+i*2));
    g.lineTo(W,H);g.closePath();g.fillStyle="rgba("+tint.join(",")+","+(.05+.012*i)+")";g.fill();
  }
  g.globalCompositeOperation="lighter";
  var ca=(1-level*.75)*.07;
  for(i=0;i<6;i++){
    var cx=(.5+.5*Math.sin(phase*.5+i*1.7))*W,cy=(.5+.5*Math.sin(phase*.35+i*2.3))*H,r=H*(.18+.04*i);
    var rg=g.createRadialGradient(cx,cy,0,cx,cy,r);rg.addColorStop(0,"rgba(200,245,255,"+ca+")");rg.addColorStop(1,"rgba(200,245,255,0)");
    g.fillStyle=rg;g.fillRect(cx-r,cy-r,2*r,2*r);
  }
  g.globalCompositeOperation="source-over";
  var n=Math.round(25+45*level),ma=.12+.5*level;
  for(i=0;i<n;i++){
    var m=motes[i];if(!reduced){m.y-=m.s*dt*.02;if(m.y<0){m.y=1;m.x=Math.random()}}
    g.fillStyle="rgba("+tint.join(",")+","+ma*(.4+.6*m.s)+")";
    g.beginPath();g.arc((m.x+.02*Math.sin(phase*.7+m.p))*W,m.y*H,m.r*dpr*(1+level),0,6.283);g.fill();
  }
  g.restore();
}

/* ---------- text on top ---------- */
function dom(n){
  var on=S.on;
  $("sys").textContent=on?"":"Taking readings…";
  $("verdict").textContent=S.hide.v?"":(lvl(n)>=.5?"Needs cleaning":"Clean");
  var w=eff(n)<80;$("warn").hidden=!w;
  ["tank","mem"].forEach(function(k){
    var L=life(k,n),due=L.pct>=REMIND_AT;
    $("h-"+k).textContent=Math.floor(L.h);
    $("bar-"+k).style.width=clamp(L.pct/100)*100+"%";
    $("life-"+k).classList.toggle("due",due);
    $("rem-"+k).hidden=!due;
    if(due)$("rem-"+k).textContent=L.pct>=100?"Service overdue, book now":"Book servicing";
  });
}
var last=0,domT=0;
function frame(ts){
  var dt=Math.min(50,ts-last||16);last=ts;
  var n=Date.now(),level=lvl(n);
  if(!reduced)phase+=dt/1000*(S.on?.5:.3);   // the water moves a little faster while powered on
  paint(level,dt);
  if(ts-domT>250){domT=ts;dom(n)}
  requestAnimationFrame(frame);
}
dom(Date.now());requestAnimationFrame(frame);
})();
</script>
</body>
</html>
